services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: taskview
      POSTGRES_USER: taskview
      POSTGRES_PASSWORD: taskview
    ports:
      - "54329:5432"
    volumes:
      - taskview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskview -d taskview"]
      interval: 2s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: ../taskview-ai
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    ports:
      - "8100:8100"

  be:
    build:
      context: .
    environment:
      TASKVIEW_AI_URL: http://ai:8100
      TASKVIEW_DATABASE_URL: postgresql://taskview:taskview@postgres:5432/taskview
    depends_on:
      ai:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8200:8200"

  fe:
    build:
      context: ../taskview-fe
    environment:
      TASKVIEW_BE_URL: http://be:8200
    depends_on:
      - be
    ports:
      - "3000:3000"

volumes:
  taskview_postgres_data:
